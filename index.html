<!DOCTYPE html>
<html>

  <title>HRMS</title>

<body>

<h2>Login</h2>

<input id="loginId" placeholder="EMP001">
<input id="loginPass" type="password" placeholder="Password">
<button onclick="doLogin()">Login</button>

<pre id="output"></pre>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7"></script>

<script>
// ===== SUPABASE =====
const supabase = window.supabase.createClient(
  'https://pnhdltojsdukrgqagcml.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBuaGRsdG9qc2R1a3JncWFnY21sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NDY2NzIsImV4cCI6MjA5MjUyMjY3Mn0.pFfbiUWmM89EScMZ_XmVIoeCHTN9TEDcq9o9WW6pD24'
);

// ===== LOGIN =====
async function doLogin() {
  const id = document.getElementById('loginId').value.trim();
  const pass = document.getElementById('loginPass').value.trim();

  const { data, error } = await supabase.rpc('login_user', {
    p_id: id,
    p_password: pass
  });

  if (error || !data?.ok) {
    document.getElementById('output').textContent = 'Invalid login';
    return;
  }

  window.currentUser = data.user;

  document.getElementById('output').textContent =
    JSON.stringify(data.user, null, 2);

  loadAll();
}

// ===== LOAD ALL DATA (replaces apiGetAll) =====
async function loadAll() {
  const { data, error } = await supabase.rpc('get_all');

  if (error) {
    console.log(error);
    return;
  }

  console.log("DATA:", data);
}

// ===== PUNCH IN =====
async function punchIn() {
  const { data, error } = await supabase.rpc('punch_in', {
    p_emp_id: currentUser.id
  });

  console.log(data, error);
}

// ===== PUNCH OUT =====
async function punchOut() {
  const { data, error } = await supabase.rpc('punch_out', {
    p_emp_id: currentUser.id
  });

  console.log(data, error);
}
</script>

</body>
</html>
