<!DOCTYPE html>
<html>
<head>
  <title>HRMS</title>
</head>
<body>

<h2>Login</h2>

<input id="id" placeholder="EMP001">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>

<hr>

<button onclick="loadData()">Load All Data</button>
<button onclick="punchIn()">Punch In</button>
<button onclick="punchOut()">Punch Out</button>

<pre id="output"></pre>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7"></script>

<script>
const supabase = window.supabase.createClient(
  'https://pnhdltojsdukrgqagcml.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBuaGRsdG9qc2R1a3JncWFnY21sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NDY2NzIsImV4cCI6MjA5MjUyMjY3Mn0.pFfbiUWmM89EScMZ_XmVIoeCHTN9TEDcq9o9WW6pD24'
);

let currentUser = null;

// ===== LOGIN =====
async function login() {
  const id = document.getElementById('id').value.trim();
  const pass = document.getElementById('pass').value.trim();

  const { data, error } = await supabase.rpc('login_user', {
    p_id: id,
    p_password: pass
  });

  if (error || !data?.ok) {
    output('Invalid login');
    return;
  }

  currentUser = data.user;
  output('Logged in:\n' + JSON.stringify(currentUser, null, 2));
}

// ===== LOAD DATA =====
async function loadData() {
  const { data, error } = await supabase.rpc('get_all');

  if (error) {
    output(error.message);
    return;
  }

  output(JSON.stringify(data, null, 2));
}

// ===== PUNCH IN =====
async function punchIn() {
  if (!currentUser) return output('Login first');

  const { data, error } = await supabase.rpc('punch_in', {
    p_emp_id: currentUser.id
  });

  if (error) return output(error.message);

  output('Punch In success');
}

// ===== PUNCH OUT =====
async function punchOut() {
  if (!currentUser) return output('Login first');

  const { data, error } = await supabase.rpc('punch_out', {
    p_emp_id: currentUser.id
  });

  if (error) return output(error.message);

  output('Punch Out success');
}

// ===== UI =====
function output(text) {
  document.getElementById('output').textContent = text;
}
</script>

</body>
</html>
